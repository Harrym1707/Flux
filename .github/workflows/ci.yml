name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # Build FIRST: the sdk-js tests import @flux/core from its dist output,
      # so a clean checkout must compile before vitest can collect them.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck:evals
      # The website generator verifies its own output (unrendered markdown,
      # missing titles or tables, and absent FAQ structured data all fail).
      - run: node --import tsx scripts/build-site.ts
