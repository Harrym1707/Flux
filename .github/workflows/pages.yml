# Deploy the committed static site (docs/site/dist) to GitHub Pages.
# No build step and no dependencies: the dist folder is built and verified
# locally by scripts/build-site.ts and committed, so this workflow only
# uploads bytes that were already checked.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/site/dist/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  geo-audit:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # The live site must keep its machine-readable GEO layer on every deploy:
      # llms.txt / llms-full.txt, explicit crawler permission, structured data
      # that parses, a sitemap whose entries resolve, and the published numbers.
      - run: node --import tsx evals/run-geo-audit.ts
        env:
          FLUX_SITE_ORIGIN: https://www.fluxtoken.dev
