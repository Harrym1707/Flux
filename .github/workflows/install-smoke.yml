# Cross-platform install smoke test. Proves both delivery routes actually run
# a working `mesh` on each supported OS/Node, so "it should work on Linux" and
# "npx works on Windows" become green checks rather than claims. Serves the
# freshly built artifacts from a local server, so it never depends on the live
# site or the deploy.
name: Install smoke test

on:
  pull_request:
    paths:
      - "docs/site/install.sh"
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/sdk-js/**"
      - "scripts/build-cli-package.ts"
      - "scripts/build-site.ts"
      - ".github/workflows/install-smoke.yml"
  push:
    branches: [main]
    paths:
      - "docs/site/install.sh"
      - "packages/cli/**"
      - "scripts/build-cli-package.ts"
      - ".github/workflows/install-smoke.yml"
  workflow_dispatch:

jobs:
  # Route 1 — the one-liner: curl the installer, let it fetch + checksum-verify
  # the runtime, then prove `mesh verify` passes. macOS and Linux, Node 22 + 24.
  curl-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm build:cli
      - name: Build the site (hosts /mesh, /mesh-runtime, /install.sh)
        run: node --import tsx scripts/build-site.ts
      - name: Install via "curl | sh" against a local server, then verify
        env:
          MESH_BASE_URL: http://127.0.0.1:8099
        run: |
          python3 -m http.server 8099 --directory docs/site/dist >/tmp/mesh-httpd.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS "$MESH_BASE_URL/mesh-version.json" >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsSL "$MESH_BASE_URL/install.sh" | sh
          echo "--- the installer fetches the runtime on first run ---"
          ~/.mesh/bin/mesh version
          ~/.mesh/bin/mesh verify

  # Route 2 — the agent / CI route: `npx @harrym1707/mesh`. The npm package ships
  # the self-contained runtime, so this runs fully offline and covers Windows,
  # where the shell installer does not apply.
  npx-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm build:cli
      - name: Pack the npm package and run it through npx
        run: |
          npm pack ./packages/cli/pkg
          # npm names the tarball after the package: @harrym1707/mesh -> harrym1707-mesh-*.tgz.
          # Glob by the actual name (not the pre-rename @mesh-ai scope), newest first.
          TARBALL=$(ls -t harrym1707-mesh-*.tgz | head -1)
          echo "packed: $TARBALL"
          npx -y "./$TARBALL" version
          npx -y "./$TARBALL" verify
